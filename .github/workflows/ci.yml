name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  test:
    name: build, lint, typecheck, unit, integration, e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_PG_ADMIN: postgres:postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit, database, jobs, outbox, API, OpenAPI contract, security, tenancy, permissions, regression
        run: pnpm test
      - name: Install browser for E2E
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (real browser)
        run: pnpm test:e2e

  infra-integration:
    name: real S3 protocol (moto) + real ClamAV
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      clamav:
        image: clamav/clamav:stable
        ports: ["3310:3310"]
      s3:
        # MinIO no longer publishes community binaries/images (HTTP 410), so the S3 protocol is served by moto.
        image: motoserver/moto:latest
        ports: ["5000:5000"]
    env:
      TEST_PG_ADMIN: postgres:postgres
      PGPASSWORD: postgres
      INFRA_REQUIRED: "1"                 # a missing service FAILS the job instead of skipping
      INFRA_ENFORCES_SIGNATURES: "0"      # moto does not validate signatures; run against real AWS S3 in the staging smoke test
      INFRA_S3_ENDPOINT: http://localhost:5000
      INFRA_CLAMAV_HOST: localhost
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - name: Wait for the S3-compatible server (moto service container)
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/ | grep -q '^200$'; then echo "moto ready"; exit 0; fi
            sleep 2
          done
          echo "moto did not become healthy"; docker ps; exit 1
      - name: Wait for ClamAV (downloads the official signature database on first start)
        run: |
          for i in $(seq 1 90); do
            if [ "$(printf 'zPING\0' | timeout 3 nc localhost 3310 | tr -d '\0')" = "PONG" ]; then echo ready; exit 0; fi
            sleep 5
          done
          echo "clamd not ready"; exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:infra

  migrations-from-scratch:
    runs-on: ubuntu-latest
    services:
      postgres: { image: "postgres:16", env: { POSTGRES_PASSWORD: postgres }, ports: ["5432:5432"] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply every migration to an empty database using the production migration script
        env: { MIGRATION_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres" }
        run: bash infra/db/migrate.sh

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  supply-chain:
    name: dependency audit + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # secret scan covers history, not just the tip
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Fails on any known advisory of high/critical severity in ANY dependency (runtime and dev tooling).
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high
      # Fails if a credential-shaped string is committed (config: .gitleaks.toml; test fixtures are allow-listed by path).
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner

  images:
    runs-on: ubuntu-latest
    needs: test
    strategy: { matrix: { target: [api, worker, web, migrate] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: uk-platform-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      # Image vulnerability scan: fail on fixable HIGH/CRITICAL findings in the OS packages and app dependencies.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: uk-platform-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
