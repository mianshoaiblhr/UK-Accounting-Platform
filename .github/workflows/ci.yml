name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  test:
    name: build, lint, typecheck, unit, integration, e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_PG_ADMIN: postgres:postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit, database, jobs, outbox, API, OpenAPI contract, security, tenancy, permissions, regression
        run: pnpm test
      - name: Install browser for E2E
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (real browser)
        run: pnpm test:e2e

  infra-integration:
    name: real S3 protocol (moto) + real ClamAV
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      clamav:
        image: clamav/clamav:stable
        ports: ["3310:3310"]
    env:
      TEST_PG_ADMIN: postgres:postgres
      PGPASSWORD: postgres
      INFRA_REQUIRED: "1"                 # a missing service FAILS the job instead of skipping
      INFRA_ENFORCES_SIGNATURES: "0"      # moto does not validate signatures; run against real AWS S3 in the staging smoke test
      INFRA_S3_ENDPOINT: http://localhost:5000
      INFRA_CLAMAV_HOST: localhost
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Start S3-compatible server (moto)
        run: |
          set -euxo pipefail
          # MinIO no longer publishes community binaries/images (HTTP 410), so use moto's S3 implementation.
          pip install "moto[server]"
          nohup moto_server -p 5000 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:5000/moto-api/; then echo "moto ready"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/moto.log" || true
          echo "moto did not become healthy"; exit 1
      - name: Wait for ClamAV (downloads the official signature database on first start)
        run: |
          for i in $(seq 1 90); do
            if [ "$(printf 'zPING\0' | timeout 3 nc localhost 3310 | tr -d '\0')" = "PONG" ]; then echo ready; exit 0; fi
            sleep 5
          done
          echo "clamd not ready"; exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:infra

  migrations-from-scratch:
    runs-on: ubuntu-latest
    services:
      postgres: { image: "postgres:16", env: { POSTGRES_PASSWORD: postgres }, ports: ["5432:5432"] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply every migration to an empty database using the production migration script
        env: { MIGRATION_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres" }
        run: bash infra/db/migrate.sh

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  images:
    runs-on: ubuntu-latest
    needs: test
    strategy: { matrix: { target: [api, worker, web, migrate] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
