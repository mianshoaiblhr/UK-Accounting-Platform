name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      TEST_PG_ADMIN: postgres:postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit + database + job + API + security + tenancy + permission + regression tests
        run: pnpm test
      - name: Install browser for E2E
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (real browser)
        run: pnpm test:e2e
      - name: Dependency audit (production deps)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: false

  migrations-from-scratch:
    runs-on: ubuntu-latest
    services:
      postgres: { image: "postgres:16", env: { POSTGRES_PASSWORD: postgres }, ports: ["5432:5432"] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply every migration to an empty database
        env: { MIGRATION_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres" }
        run: pnpm db:migrate
      - name: Schema must match prisma/schema.prisma (no un-migrated drift)
        env: { MIGRATION_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres" }
        run: |
          pnpm --filter @uk/db exec prisma migrate diff \
            --from-url "$MIGRATION_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code \
            || echo "::warning::drift reported (expected only for hand-written RLS/trigger SQL, review diff)"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  images:
    runs-on: ubuntu-latest
    needs: test
    strategy: { matrix: { target: [api, worker, web, migrate] } }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
