# Local development dependencies. `docker compose -f infra/docker/docker-compose.yml up -d`
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: uk_accounting }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
  minio:            # S3-compatible; same S3Storage adapter as AWS (set S3_ENDPOINT)
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio-secret }
    ports: ["9000:9000", "9001:9001"]
  mailpit:          # inspect outgoing mail at http://localhost:8025 (use EMAIL_DRIVER=file or point SES-compatible tooling here)
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
  clamav:           # AV_DRIVER=clamav, CLAMAV_HOST=localhost
    image: clamav/clamav:stable
    ports: ["3310:3310"]
volumes:
  pgdata:
